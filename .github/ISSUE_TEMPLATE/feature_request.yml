name: Feature Request
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
description: Suggest a new feature or improvement for MoonTUI
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe your idea below.

        Before submitting:
        - Search [existing issues](https://github.com/Ermianr/moontui/issues) to avoid duplicates
        - Check if this is already planned or discussed

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve? Describe your use case.
      placeholder: I want to... so that I can...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe how you propose to solve the problem. Include API examples if applicable.
      render: TypeScript
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered.

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context about the feature request (screenshots, related issues, references).
